version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: maskd_user
      POSTGRES_PASSWORD: maskd_pass
      POSTGRES_DB: maskd_keys
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  key-server:
    build: .
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://maskd_user:maskd_pass@db:5432/maskd_keys
      - FLASK_SECRET_KEY=dev-secret-key
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=admin123
      - APP_SECRET=default-dev-app-secret-do-not-use-in-prod
      - MODEL_DECRYPTION_KEY_B64=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    depends_on:
      - db

volumes:
  postgres_data:
